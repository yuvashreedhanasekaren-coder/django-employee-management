<!DOCTYPE html>
<html>
<head>
    <title>Employee Management</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg,#6366f1,#9333ea);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .card{
            background:white;
            padding:30px;
            width:350px;
            border-radius:16px;
            box-shadow:0 20px 40px rgba(0,0,0,.2);
            animation:fade 0.6s ease;
        }
        h2{
            text-align:center;
            margin-bottom:20px;
        }
        input,button{
            width:100%;
            padding:10px;
            margin:8px 0;
            border-radius:8px;
            border:1px solid #ddd;
        }
        button{
            background:#6366f1;
            color:white;
            border:none;
            cursor:pointer;
        }
        button:hover{
            background:#4f46e5;
        }
        a{
            text-decoration:none;
            color:#6366f1;
            font-size:14px;
        }
        .error{
            color:red;
            text-align:center;
        }
        @keyframes fade{
            from{opacity:0; transform:translateY(20px)}
            to{opacity:1; transform:translateY(0)}
        }
    </style>
</head>
<body>

<div class="card">
    {% block content %}{% endblock %}
</div>

</body>
</html>
