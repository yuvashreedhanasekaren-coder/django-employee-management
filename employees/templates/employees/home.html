<!DOCTYPE html>
<html>
<head>
  <title>Employee Management</title>
  <style>
body {
  font-family: 'Poppins', sans-serif;
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  position: relative;
  background: #162447;
  border-radius: 20px;
  width: 400px;
  padding: 50px 30px;
  overflow: hidden;
  text-align: left;
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 8px;
  height: 100%;
  background: linear-gradient(180deg, #e43a15, #e65245);
  border-radius: 8px 0 0 8px;
}

h2 {
  margin-bottom: 30px;
  font-size: 2rem;
  color: #f5f5f5;
  text-align: center;
}

a {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 15px 0;
  padding: 14px 20px;
  background: #e43a15;
  color: #fff;
  font-weight: 600;
  border-radius: 12px;
  text-decoration: none;
  transition: 0.3s;
  box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}

a:hover {
  background: #e65245;
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 12px 20px rgba(0,0,0,0.4);
}

@keyframes sparkle {
  0% { transform: scale(0.8) rotate(0deg); opacity: 0.6;}
  100% { transform: scale(1.2) rotate(20deg); opacity: 1;}
}


  </style>
</head>
<body>

<div class="card">
  <h2>Employee Management System</h2>

  <a href="/add/">➕Add Employee</a>
  <a href="{% url 'search_options' %}">🔍Search Employee</a>
  <a href="/list/" class="btn">📋Employee List</a>

</div>

</body>
</html>
